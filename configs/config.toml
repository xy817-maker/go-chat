[mainConfig]
appName = "your app name"
host = "0.0.0.0"
port = 8000

[mysqlConfig]
host = "127.0.0.1"
port = 3306
user = "root"
password = "123456"
databaseName = "kamachat"

[redisConfig]
host = "127.0.0.1"
port = 6379
password = ""
db = 0

[authCodeConfig]
accessKeyID = "your accessKeyID in alibaba cloud"
accessKeySecret = "your accessKeySecret in alibaba cloud"
signName = "阿里云短信测试"
templateCode = "SMS_154950909"

[logConfig]
logPath = "logs/app.log"

[messageQueueConfig]
messageMode = "rocketmq" # 消息模式 channel or rocketmq
hostPort = "127.0.0.1:9876" # RocketMQ NameServer 地址
groupName = "chat_group" # 消费组名称
loginTopic = "login"
chatTopic = "chat_message"
logoutTopic = "logout"
partition = 0 # 兼容字段，RocketMQ 不使用
timeout = 1 # 单位秒

[staticSrcConfig]
staticAvatarPath = "./static/avatars"
staticFilePath = "./static/files"

[rateLimitConfig]
rps = 5.0 # 每秒令牌数（按 IP）
burst = 10 # 令牌桶容量
